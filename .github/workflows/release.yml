name: Joao Browser Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Internal tagged build phase; leave empty to stamp latest main'
        required: false
        default: ''
        type: string
      release_commit:
        description: 'Exact commit for release_tag; leave empty to stamp latest main'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: joao-browser-release
  cancel-in-progress: true

jobs:
  stamp:
    if: github.repository == 'JoaoDEVWHADS/joao-browser' && inputs.release_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      # Fetch one trusted source file through the API, not a Chromium checkout.
      - name: Commit UTC version and tag latest main
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          REQUESTED_COMMIT: ${{ inputs.release_commit }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, sys, tempfile
          from urllib.request import Request, urlopen
          if os.environ.get('REQUESTED_COMMIT'):
              raise ValueError('release_commit requires release_tag')
          url = ('https://api.github.com/repos/' + os.environ['GH_REPO'] +
                 '/contents/tools/joao_browser/stamp_version.py?ref=' + os.environ['SOURCE_SHA'])
          request = Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'JoaoBrowserRelease'})
          with urlopen(request, timeout=60) as response:
              source = base64.b64decode(json.load(response)['content'])
          with tempfile.TemporaryDirectory() as directory:
              script = pathlib.Path(directory) / 'stamp_version.py'
              script.write_bytes(source)
              subprocess.run([sys.executable, str(script)], check=True)
          PY
  windows:
    # Use GitHub-hosted Windows; validate actual capacity before downloading Chromium.
    # The explicit tagged dispatch is a separate run. It cancels the stamping
    # run and any older release build; it never stamps another version.
    if: github.repository == 'JoaoDEVWHADS/joao-browser' && github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: windows-2025-vs2026
    # GitHub-hosted jobs have a six-hour execution limit.
    timeout-minutes: 360
    permissions:
      contents: write
    defaults:
      run:
        shell: powershell
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_COMMIT: ${{ inputs.release_commit }}
    steps:
      - name: Validate release tag
        run: |
          if ($env:RELEASE_TAG -notmatch '^joao-v[0-9]{14}$') {
            throw 'Invalid release tag'
          }
          if ($env:RELEASE_COMMIT -notmatch '^[0-9a-f]{40}$') {
            throw 'Invalid release commit'
          }
          if ($env:GITHUB_REF -ne "refs/tags/$env:RELEASE_TAG" -or $env:GITHUB_SHA -ne $env:RELEASE_COMMIT) {
            throw 'Build dispatch must target the exact stamped tag and commit'
          }
      - name: Check hosted machine capacity before source download
        run: |
          $ErrorActionPreference = 'Stop'
          $memoryGiB = [Math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 2)
          $driveName = [IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE).Substring(0, 1)
          $drive = Get-PSDrive -Name $driveName
          $freeGiB = [Math]::Round($drive.Free / 1GB, 2)
          $summary = "GitHub-hosted runner: $env:ImageOS; RAM: $memoryGiB GiB; workspace free: $freeGiB GiB."
          Write-Output $summary
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free | Format-Table
          $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/Include'
          if (Test-Path $sdk) { Get-ChildItem $sdk -Directory | Select-Object Name }
          if ($memoryGiB -lt 8) { throw 'Chromium requires at least 8 GiB RAM.' }
          if ($drive.Free -lt 100GB) {
            throw "Insufficient disk for Chromium: $freeGiB GiB free; source build requires at least 100 GiB before checkout. The standard GitHub-hosted machine cannot fit this build."
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -version '[18.0,19.0)' -requires Microsoft.VisualStudio.Component.VC.ATLMFC -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'Visual Studio 2026 with C++ ATL/MFC is required.' }
          "vs2026_install=$vs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_commit }}
          path: src
          fetch-depth: 1
          persist-credentials: false
      - name: Build and validate packages
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = (& git -C src rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve source commit' }
          if ($commit -ne $env:RELEASE_COMMIT) { throw 'Stamped source commit mismatch' }
          & ./src/tools/joao_browser/build.ps1 -Tag $env:RELEASE_TAG -Commit $commit
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $env:GITHUB_WORKSPACE "release-$env:RELEASE_TAG"
          $manifest = Get-Content (Join-Path $directory 'release-manifest.json') -Raw | ConvertFrom-Json
          foreach ($property in $manifest.artifacts.PSObject.Properties) {
            $path = Join-Path $directory $property.Name
            if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $property.Value.sha256) {
              throw "Artifact changed after validation: $path"
            }
          }
          # Refuse replacing existing releases: online installers embed exact hashes.
          & gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; use a new release tag.' }
          $notes = Join-Path $directory 'release-notes.md'
          @'
          Windows x64: choose portable.zip, online.exe or offline.exe.
          Extract the portable ZIP and run chrome.exe; keep joao_portable beside it.
          The portable profile is local to its folder. Windows-protected passwords
          and cookies remain bound to the Windows account/machine.
          The online installer downloads the exact offline installer in this release
          and verifies its embedded SHA-256 before executing it.
          SHA256SUMS.txt and release-manifest.json describe the published artifacts.
          '@ | Set-Content $notes -Encoding utf8
          & gh release create $env:RELEASE_TAG --verify-tag --draft --title "Joao Browser $env:RELEASE_TAG" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          $assets = @($manifest.artifacts.PSObject.Properties.Name | ForEach-Object { Join-Path $directory $_ })
          $assets += Join-Path $directory 'release-manifest.json'
          $assets += Join-Path $directory 'SHA256SUMS.txt'
          & gh release upload $env:RELEASE_TAG @assets
          if ($LASTEXITCODE -ne 0) { throw 'Upload failed; draft retained for inspection' }
          & gh release edit $env:RELEASE_TAG --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; inspect draft' }
